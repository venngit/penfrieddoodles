<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="A Pen-Fried Doodles design.">
	<title>Doodle | Pen-Fried Doodles</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<header class="site-header">
		<a class="brand" href="index.html" aria-label="Pen-Fried Doodles home"><span>PEN-FRIED</span><span>DOODLES</span></a>
		<nav class="nav" aria-label="Primary navigation">
			<a href="all_doodles.html">ALL DOODLES</a>
			<a href="https://www.redbubble.com/people/swwtsourcookies/explore?page=1&amp;sortOrder=recent">REDBUBBLE</a>
		</nav>
	</header>

	<main class="page detail detail-page" id="design-detail"></main>

	<footer><span>PEN-FRIED DOODLES / 2026</span><span>Illustrations for your good side.</span></footer>

	<script>
		const illustrations = [
			{ name: 'Hooray Penguin', slug: 'hooray-penguin', description: 'A tiny celebration with absolutely no inside voice.', image: 'designs/doodles/Horray%20Penguin.webp', category: 'Character', tags: 'PENGUIN, CELEBRATION', color: '#83aef3' },
			{ name: 'Cute Puffin', slug: 'cute-puffin', description: 'A puffin who has perfected the art of looking mildly surprised.', image: 'designs/doodles/Cute%20Puffin.webp', category: 'Character', tags: 'PUFFIN, BIRD', color: '#ffe500' },
			{ name: 'Hello Dog', slug: 'hello-dog', description: 'A dog with a greeting prepared for every possible occasion.', image: 'designs/doodles/Hello%20Dog.webp', category: 'Character', tags: 'DOG, HELLO', color: '#ff9b8d' },
			{ name: 'Happy Shiba', slug: 'happy-shiba', description: 'Professionally cheerful. Off the clock, still pretty cheerful.', image: 'designs/doodles/Happy%20Shiba.webp', category: 'Character', tags: 'DOG, SHIBA', color: '#ffb10b' },
			{ name: 'Cozy Monkey', slug: 'cozy-monkey', description: 'No agenda. No shoes. Very serious about being cozy.', image: 'designs/doodles/Cozy%20Monkey.webp', category: 'Character', tags: 'MONKEY, COZY', color: '#9a3e3e' },
			{ name: "Dog's Business", slug: 'dogs-business', description: 'A dog with a very important meeting and no visible calendar.', image: 'designs/doodles/Dog%27s%20Business.webp', category: 'Character', tags: 'DOG, WORK', color: '#121212' },
			{ name: 'Winter Arctic Fox', slug: 'winter-arctic-fox', description: 'A winter-ready fox with a very good view of the snow.', image: 'designs/doodles/Winter%20Arctic%20Fox.webp', category: 'Character', tags: 'FOX, WINTER', color: '#c8d5ad' },
			{ name: 'Alpapa Alpaca', slug: 'alpapa-alpaca', description: 'An alpaca with a name almost as fluffy as its coat.', image: 'designs/doodles/Alpapa%20Alpaca.png', category: 'Character', tags: 'ALPACA, FLUFFY', color: '#dd9ead' },
			{ name: 'Summer Arctic Fox', slug: 'summer-arctic-fox', description: 'A sun-soaked fox enjoying the warmer side of the year.', image: 'designs/doodles/Summer%20Arctic%20Fox.png', category: 'Character', tags: 'FOX, SUMMER', color: '#83aef3' },
			{ name: 'Arctic Fox Duo', slug: 'arctic-fox-duo', description: 'Two arctic foxes, twice the winter-ready charm.', image: 'designs/doodles/Arctic%20Fox%20Duo.png', category: 'Character', tags: 'FOX, ARCTIC, DUO', color: '#b7c9dd' }
		];

		const selectedSlug = new URLSearchParams(location.search).get('design');
		const illustrationIndex = illustrations.findIndex(illustration => illustration.slug === selectedSlug);
		const illustration = illustrations[illustrationIndex === -1 ? 0 : illustrationIndex];
		const previous = illustrations[(illustrationIndex - 1 + illustrations.length) % illustrations.length];
		const next = illustrations[(illustrationIndex + 1) % illustrations.length];

		document.title = `${illustration.name} | Pen-Fried Doodles`;
		document.getElementById('design-detail').innerHTML = `
			<section class="detail-art" style="--detail-color:${illustration.color}"><img src="${illustration.image}" alt="${illustration.name} illustration" width="1600" height="1600" fetchpriority="high" decoding="async"></section>
			<section class="detail-copy"><span class="eyebrow">Pen-Fried Doodles / ${illustration.category}</span><h1>${illustration.name.toUpperCase()}</h1><p>${illustration.description}</p><div class="detail-meta"><span class="meta">CATEGORY / ${illustration.category.toUpperCase()}</span><span class="meta">TAGS / ${illustration.tags}</span><a class="button-link" href="https://www.redbubble.com/people/swwtsourcookies/explore?page=1&amp;sortOrder=recent">VISIT REDBUBBLE &rarr;</a></div><nav class="detail-nav"><a href="doodle.html?design=${previous.slug}">&larr; PREVIOUS</a><a href="doodle.html?design=${next.slug}">NEXT &rarr;</a></nav></section>`;
	</script>
</body>
</html>
