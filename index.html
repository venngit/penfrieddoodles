<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Pen-Fried Doodles: colourful little characters and strange ideas.">
	<title>Pen-Fried Doodles</title>
	<link rel="preload" as="image" href="designs/doodles/Horray%20Penguin.webp" type="image/webp" fetchpriority="high">
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<header class="site-header">
		<a class="brand" href="#/" aria-label="Pen-Fried Doodles home"><span>PEN-FRIED</span><span>DOODLES</span></a>
		<button class="menu-button" id="menu-button" aria-label="Toggle menu">+</button>
		<nav class="nav" id="nav"><a href="#/designs">DOODLES</a><a href="#/about">ABOUT</a><a href="#/shop">SHOP</a><a href="#/contact">CONTACT</a></nav>
	</header>
	<main id="app"></main>
	<footer><span>PEN-FRIED DOODLES / 2026</span><span>Illustrations for your good side. Made with love from Iceland 🇮🇸. </span></footer>
	<script>
		const illustrations = [
			{ id: 1, name: "Hooray Penguin", slug: "hooray-penguin", description: "A tiny celebration with absolutely no inside voice.", image: "designs/doodles/Horray Penguin.webp", category: "Character", tags: ["penguin", "celebration"], color: "#83aef3", featured: true, heroLabel: "HOORAY!" },
			{ id: 2, name: "Cute Puffin", slug: "cute-puffin", description: "A puffin who has perfected the art of looking mildly surprised.", image: "designs/doodles/Cute Puffin.webp", category: "Character", tags: ["puffin", "bird"], color: "#ffe500", featured: true },
			{ id: 3, name: "Hello Dog", slug: "hello-dog", description: "A dog with a greeting prepared for every possible occasion.", image: "designs/doodles/Hello Dog.webp", category: "Character", tags: ["dog", "hello"], color: "#ff9b8d", featured: true },
			{ id: 4, name: "Happy Shiba", slug: "happy-shiba", description: "Professionally cheerful. Off the clock, still pretty cheerful.", image: "designs/doodles/Happy Shiba.webp", category: "Character", tags: ["dog", "shiba"], color: "#ffb10b", featured: false },
			{ id: 5, name: "Cozy Monkey", slug: "cozy-monkey", description: "No agenda. No shoes. Very serious about being cozy.", image: "designs/doodles/Cozy Monkey.webp", category: "Character", tags: ["monkey", "cozy"], color: "#9a3e3e", featured: false },
			{ id: 6, name: "Dog's Business", slug: "dogs-business", description: "A dog with a very important meeting and no visible calendar.", image: "designs/doodles/Dog's Business.webp", category: "Character", tags: ["dog", "work"], color: "#080808", featured: true },
			{ id: 7, name: "Winter Arctic Fox", slug: "winter-arctic-fox", description: "A winter-ready fox with a very good view of the snow.", image: "designs/doodles/Winter Arctic Fox.webp", category: "Character", tags: ["fox", "winter"], color: "#c8d5ad", featured: false },
			{ id: 8, name: "Alpapa Alpaca", slug: "alpapa-alpaca", description: "An alpaca with a name almost as fluffy as its coat.", image: "designs/doodles/Alpapa Alpaca.png", category: "Character", tags: ["alpaca", "fluffy"], color: "#dd9ead", featured: false, isNew: true },
			{ id: 9, name: "Summer Arctic Fox", slug: "summer-arctic-fox", description: "A sun-soaked fox enjoying the warmer side of the year.", image: "designs/doodles/Summer Arctic Fox.png", category: "Character", tags: ["fox", "summer"], color: "#83aef3", featured: false, isNew: true },
			{ id: 10, name: "Arctic Fox Duo", slug: "arctic-fox-duo", description: "Two arctic foxes, twice the winter-ready charm.", image: "designs/doodles/Arctic Fox Duo.png", category: "Character", tags: ["fox", "arctic", "duo"], color: "#b7c9dd", featured: false, isNew: true }
		];

		const heroIllustration = illustrations.find(illustration => illustration.heroLabel) ?? illustrations[0];
		const newIllustrations = illustrations.filter(illustration => illustration.isNew);
		const artwork = illustration => `<div class="art-frame" style="--card-color:${illustration.color}"><img src="${illustration.image}" alt="${illustration.name}" width="1600" height="1600" loading="lazy" decoding="async" onerror="this.remove()"></div>`;
		const illustrationCard = (illustration, featured = false) => `<a class="design-card${featured ? ' feature' : ''}" href="#/designs/${illustration.slug}">${artwork(illustration)}<div class="card-info"><span class="card-title">${illustration.name.toUpperCase()}</span><span class="meta">${illustration.category}</span></div></a>`;
		const newMemberCard = illustration => `<a class="new-member-card" href="#/designs/${illustration.slug}"><div class="new-member-art" style="--card-color:${illustration.color}"><span class="new-badge">NEW</span><img src="${illustration.image}" alt="${illustration.name}" width="1600" height="1600" loading="lazy" decoding="async" onerror="this.remove()"></div><span class="new-member-name">${illustration.name.toUpperCase()}</span></a>`;
		const header = (title, subhead) => `<section class="page-header"><span class="eyebrow">Pen-Fried Doodles / Illustration archive</span><h1 class="page-title">${title}</h1><p>${subhead}</p></section>`;
		function home() { return `<div class="page">
			<section class="hero"><div class="hero-copy"><div><span class="eyebrow">Illustrations and little oddballs</span><h1>SMALL<br>DOODLES.<br>BIG<br>PERSONALITY.</h1></div><a class="button-link" href="#/designs">SEE ALL DOODLES &rarr;</a></div><div class="hero-art" data-hero-label="${heroIllustration.heroLabel ?? ''}"><img class="hero-design-art" src="${heroIllustration.image}" alt="${heroIllustration.name}" width="1600" height="1600" fetchpriority="high" decoding="async"></div></section>
			<section class="intro-band section"><span class="eyebrow">01 / The idea</span><p>Colourful little characters, strange ideas and things that probably did not need to exist, but do.</p></section>
			<section class="new-members" aria-labelledby="new-members-title"><div class="new-members-head"><div><span class="eyebrow">Fresh from the sketchbook</span><h2 id="new-members-title">NEW<br>MEMBERS!</h2></div><div class="new-member-controls"><button class="slider-button" type="button" data-slider-direction="previous" aria-label="Show previous new doodle">&larr;</button><button class="slider-button" type="button" data-slider-direction="next" aria-label="Show next new doodle">&rarr;</button></div></div><div class="new-member-viewport" id="new-member-slider" aria-label="New doodles"><div class="new-member-track">${newIllustrations.map(newMemberCard).join('')}</div></div></section>
			<section class="section"><div class="section-head"><h2>FEATURED<br>WORK</h2><a class="arrow-link" href="#/designs">View all doodles &rarr;</a></div><div class="design-grid">${illustrations.filter(illustration => illustration.featured).slice(0,3).map((illustration, index) => illustrationCard(illustration, index === 0)).join('')}</div></section>
			<section class="black-band"><span class="eyebrow">Pen-Fried Doodles / Est. somewhere between a sketchbook and a snack</span><p>Made for people who like their cheerful things with a bit more bite.</p></section>
			<section class="coral-band"><div class="words"><span class="eyebrow">The full archive</span><h2>ALL THE LITTLE GUYS LIVE HERE.</h2><a class="button-link" href="#/designs">EXPLORE DOODLES &rarr;</a></div><div class="coral-art">*</div></section>
		</div>`; }
		function designsPage() { return `<div class="page gallery-page">${header('DOODLES', 'Every little thing we\'ve drawn.')}<div class="design-grid">${illustrations.map(illustration => illustrationCard(illustration)).join('')}</div></div>`; }
		function detail(slug) { const index = illustrations.findIndex(illustration => illustration.slug === slug); const illustration = illustrations[index]; if (!illustration) return designsPage(); const previous = illustrations[(index - 1 + illustrations.length) % illustrations.length], next = illustrations[(index + 1) % illustrations.length]; return `<div class="page detail"><section class="detail-art" style="--detail-color:${illustration.color}"><img src="${illustration.image}" alt="${illustration.name}" width="1600" height="1600" fetchpriority="high" decoding="async" onerror="this.remove()"></section><section class="detail-copy"><span class="eyebrow">Doodle ${String(illustration.id).padStart(2,'0')} / ${illustration.category}</span><h1>${illustration.name.toUpperCase()}</h1><p>${illustration.description}</p><div class="detail-meta"><span class="meta">CATEGORY / ${illustration.category}</span><span class="meta">TAGS / ${illustration.tags.join(', ').toUpperCase()}</span><span class="meta">SHOP RELEASE / COMING SOON</span></div><nav class="detail-nav"><a href="#/designs/${previous.slug}">&larr; PREVIOUS</a><a href="#/designs/${next.slug}">NEXT &rarr;</a></nav></section></div>`; }
		function about() { return `<div class="page"><section class="about-intro"><h1>COMING<br>SOON.</h1></section></div>`; }
		function shop() { return `<div class="page shop-page"><section class="shop-copy"><span class="eyebrow">The future stationery shop</span><h1>THE<br>SHOP IS<br>GETTING<br>READY.</h1><p>A stationery shop is on its way. Stickers will be the first thing on the shelves.</p></section><section class="shop-side">!</section></div>`; }
		function contact() { return `<div class="page"><section class="about-intro"><h1>COMING<br>SOON.</h1></section></div>`; }
		function setupNewMemberSlider() { const viewport = document.getElementById('new-member-slider'); if (!viewport || matchMedia('(prefers-reduced-motion: reduce)').matches) return; const track = viewport.querySelector('.new-member-track'); const cards = [...track.children]; const controls = document.querySelectorAll('[data-slider-direction]'); let currentSlide = 0, autoplay; const step = () => cards[0].getBoundingClientRect().width + parseFloat(getComputedStyle(track).gap); const maxSlide = () => Math.max(0, Math.ceil((track.scrollWidth - viewport.clientWidth) / step())); const showSlide = direction => { const maximum = maxSlide(); if (!maximum) return; currentSlide = (currentSlide + direction + maximum + 1) % (maximum + 1); viewport.scrollTo({ left: currentSlide * step(), behavior: 'smooth' }); }; const startAutoplay = () => { autoplay = window.setInterval(() => showSlide(1), 4500); }; const stopAutoplay = () => window.clearInterval(autoplay); controls.forEach(control => control.addEventListener('click', () => { showSlide(control.dataset.sliderDirection === 'next' ? 1 : -1); stopAutoplay(); startAutoplay(); })); viewport.addEventListener('mouseenter', stopAutoplay); viewport.addEventListener('mouseleave', startAutoplay); viewport.addEventListener('focusin', stopAutoplay); viewport.addEventListener('focusout', startAutoplay); startAutoplay(); }
		function render() { const path = location.hash.slice(1) || '/'; let output = path === '/' ? home() : path === '/designs' ? designsPage() : path.startsWith('/designs/') ? detail(path.split('/').pop()) : path === '/about' ? about() : path === '/shop' ? shop() : path === '/contact' ? contact() : home(); document.getElementById('app').innerHTML = output; document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + path)); document.getElementById('nav').classList.remove('open'); setupNewMemberSlider(); window.scrollTo({top:0, behavior:'instant'}); }
		window.addEventListener('hashchange', render); document.getElementById('menu-button').addEventListener('click', () => document.getElementById('nav').classList.toggle('open')); render();
	</script>
</body>
</html>
